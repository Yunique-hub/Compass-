name: compass-student-growth
version: 2.1.0
scope: private
description: >-
  面向大学生的行动优先成长导师：当用户说“我现在该做什么”“我很迷茫”
  “我是大二”“明年实习”“怎么准备实习”“帮我规划学习”“帮我制定目标”
  “我适合什么工作”“继续上次计划”“这周学什么”或“任务太多了”时，提供
  职业就业方向分析、公开招聘数据与 JD 分析、课程考试复习、学习规划、成长复盘和长期记忆；
  支持 Review、Memory、Improvement、Evolution、Research、Proactive 六脑协作。
entrypoint: scripts/compass_engine.py
python: ">=3.10"
runtime:
  default_memory: sqlite
  network: explicit-public-readonly
  background_push: false
optional_services:
  - neo4j
  - agent-browser
artifacts:
  skill_zip: dist/compass-student-growth-2.1.0-skill.zip
  full_zip: dist/compass-student-growth-2.1.0-full.zip

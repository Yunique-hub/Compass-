name: compass-student-growth
version: 2.0.0
scope: private
description: >-
  面向大学生的职业就业方向分析、公开招聘数据与 JD 分析、课程考试复习、
  统一学习规划、成长复盘和应用层长期记忆 Skill；支持 Review、Memory、
  Improvement、Evolution、Research、Proactive 六脑协作与 Growth Archive v2。
entrypoint: scripts/compass_engine.py
python: ">=3.10"
runtime:
  default_memory: sqlite
  network: explicit-public-readonly
  background_push: false
optional_services:
  - neo4j
  - agent-browser
artifacts:
  skill_zip: dist/compass-student-growth-2.0.0-skill.zip
  full_zip: dist/compass-student-growth-2.0.0-full.zip

[project]
name = "compass-student-growth"
version = "2.1.0"
description = "离线优先、行动优先、六脑协作的大学生成长导师 Skill"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.20",
  "markitdown>=0.1.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
norecursedirs = ["vendor", "runtime", "node_modules", ".venv", ".tooling", ".test-deps"]

[project]
name = "compass-student-growth"
version = "2.5.1"
description = "行动优先、证据驱动、长期连续的大学生成长智能体 Skill"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.20",
  "markitdown>=0.1.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pydantic>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
norecursedirs = ["vendor", "runtime", "node_modules", ".venv", ".tooling", ".test-deps"]

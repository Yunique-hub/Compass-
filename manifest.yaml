name: compass-student-growth
version: 2.5.1
scope: private
description: >-
  面向大学生的行动优先成长导师：当用户说“我现在该做什么”“我很迷茫”
  “我是大二”“明年实习”“怎么准备实习”“帮我规划学习”“帮我制定目标”
  “我适合什么工作”“继续上次计划”“这周学什么”或“任务太多了”时，提供
  任意专业与学科族的成长路径、升学/科研/资格考试/实习就业方向、公开招聘数据和 JD 分析、领域能力差距、学习规划、AI 陪学、领域证据、成长复盘和长期记忆；
  首轮任务不被称呼或完整画像阻塞，外部事实不足时明确标记不确定性。
entrypoint: scripts/compass_engine.py
python: ">=3.10"
runtime:
  default_memory: sqlite
  network: explicit-public-readonly
  background_push: false
optional_services:
  - neo4j
  - agent-browser
artifacts:
  skill_zip: dist/compass-student-growth-2.5.1-skill.zip
  dev_zip: dist/compass-student-growth-2.5.1-dev.zip
  full_zip: dist/compass-student-growth-2.5.1-full.zip
